name: PostFlight Complete QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/zernio-visitor-readonly]
  # GitHub cron is UTC. 02:30 UTC = 08:00 Asia/Kolkata.
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel scheduled or main-branch audits. Superseded PR checks may be cancelled.
concurrency:
  group: complete-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-browser-and-api-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Prepare headless Chromium
        run: npx --yes playwright@1.65.0 install chromium
      - name: Run all isolated Java and browser checks
        run: bash scripts/qa/run_complete_qa_ci.sh
      - name: Save complete QA screenshots and result inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postflight-complete-qa
          path: qa-reports/ci-complete/
          if-no-files-found: warn
          retention-days: 14
